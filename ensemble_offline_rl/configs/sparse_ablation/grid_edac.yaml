command:
  - python3
  - ${program}
  - ${args_no_boolean_flags}
entity: ensemble_offline_rl
method: grid
name: edac
program: algorithms/unified.py
project: ensemble_offline_rl

parameters:
  # --- Experiment ---
  seed:
    values: [0, 1, 2, 3, 4]  # 5 runs per config
  dataset_source:
    value: d4rl
  dataset_name:
    values:
      - antmaze-large-diverse-v2
      - antmaze-medium-diverse-v2
      - antmaze-medium-play-v2
      - antmaze-large-play-v2
  algorithm:
    value: msg
  num_updates: # Train for 500k
    value: 500_000
  eval_interval:
    value: 10_000
  eval_workers:
    value: 8
  eval_final_episodes:
    value: 100

  # --- Logging ---
  log:
    value: true
  checkpoint_dir:
    value: "./checkpoints/sparse_edac"
  checkpoint:
    value: true
  # --- Generic optimization ---
  lr:
    value: 0.0003
  actor_lr:
    value: 0.0003
  batch_size:
    value: 256
  gamma:
    value: 0.99
  polyak_step_size:
    value: 0.005

  # --- EDAC specific ---
  num_critics:
    value: 10

  critic_regularizer:
    value: "none"
  ensemble_regularizer:
    value: "edac"
  reg_lagrangian:
    values: 
      - 1.0
      - 5.0
      - 10.0
      - 50.0
  shared_targets:
    value: true
  pi_operator:
    value: "min"
  
